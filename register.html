<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — One Vision Community</title>
  <meta name="description" content="Rejoignez One Vision Community. Accédez aux lives, salons et replays.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=9">
</head>
<body class="checkout-body">

  <header style="padding: 0.85rem 1rem; border-bottom: 1px solid rgba(15, 23, 42, 0.06); background: #ffffff;">
    <div class="container" style="max-width: 960px; margin: 0 auto; display:flex; justify-content:space-between; align-items:center;">
      <a href="index.html" class="logo" aria-label="One Vision Community" style="text-decoration:none;">
        <div class="logo-text">
          <span class="logo-brand"><span class="logo-one-script">One</span> Vision</span>
          <span class="logo-sub">Community</span>
        </div>
      </a>
    </div>
  </header>

  <main class="section auth-section" style="min-height: calc(100vh - 140px); display:flex; align-items:center; justify-content:center; padding: 2.5rem 1rem; background: #0f172a08;">
    <div class="auth-card">
      
      <!-- Bouton Fermer ✕ -->
      <a href="index.html" class="modal-close-btn" aria-label="Fermer et retourner à l'accueil">✕</a>

      <!-- En-tête de la carte -->
      <div style="margin-bottom: 1.25rem; text-align: left;">
        <h1 style="font-size: 1.55rem; font-weight: 800; color: #0f172a; margin: 0 0 0.35rem 0; letter-spacing: -0.02em;">
          Inscription Membre
        </h1>
        <p style="font-size: 0.9rem; color: #64748b; margin: 0; line-height: 1.45;">
          Rejoignez le réseau One Vision et accédez à tous vos espaces.
        </p>
      </div>

      <!-- Onglets Connexion / Inscription -->
      <div class="auth-tabs" role="tablist">
        <a href="login.html" class="auth-tab-btn" role="tab">Connexion</a>
        <a href="register.html" class="auth-tab-btn active" role="tab">Inscription</a>
      </div>

      <!-- Bouton Google / Gmail -->
      <button type="button" class="btn-google-auth" id="googleRegisterBtn" onclick="handleGoogleRegister()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>S'inscrire avec Google</span>
      </button>

      <div class="auth-divider">
        <span>ou avec votre email</span>
      </div>

      <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label for="regName" class="form-label">Nom complet</label>
          <input 
            type="text" 
            id="regName" 
            class="form-input" 
            placeholder="Gkd" 
            value="Gkd" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Adresse email</label>
          <input 
            type="email" 
            id="regEmail" 
            class="form-input" 
            placeholder="gatadesirekana@gmail.com" 
            value="gatadesirekana@gmail.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="regPassword" class="form-label">Mot de passe</label>
          <input 
            type="password" 
            id="regPassword" 
            class="form-input" 
            placeholder="Au moins 6 caractères" 
            required 
            minlength="6" 
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary modal-submit-btn">
          S'inscrire
        </button>
      </form>

    </div>
  </main>

  <script>
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      localStorage.setItem('ov_member_name', name);
      localStorage.setItem('ov_member_email', email);
      localStorage.setItem('ov_logged_in', 'true');
      
      // Redirection directe vers la page de questionnaire
      window.location.href = 'questionnaire.html';
    }

    function handleGoogleRegister() {
      localStorage.setItem('ov_member_name', 'Alexandre Martin');
      localStorage.setItem('ov_member_email', 'gatadesirekana@gmail.com');
      localStorage.setItem('ov_logged_in', 'true');
      
      // Redirection directe vers la page de questionnaire
      window.location.href = 'questionnaire.html';
    }
  </script>
</body>
</html>
